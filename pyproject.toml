[project]
name = "semi-autoregress-flm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets==3.6.0",
    "einops==0.8.1",
    "entmax==1.3",
    "fsspec==2025.3.0",
    "hf-transfer==0.1.9",
    "huggingface-hub==0.36.0",
    "hydra-core==1.3.2",
    "lightning==2.6.0",
    "numpy==2.2.6",
    "nvitop==1.3.2",
    "omegaconf==2.3.0",
    "packaging==25.0",
    "requests==2.32.4",
    "rich==14.2.0",
    "scipy==1.16.3",
    "setuptools>=70",
    "timm==1.0.22",
    "tokenizers==0.22.1",
    "torch==2.6.0",
    "torchmetrics==1.8.2",
    "tqdm==4.67.1",
    "transformers==4.57.3",
    "triton==3.2.0",
    "wandb==0.23.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.uv]
# Resolve for the cluster as well as this machine: every locked package must
# have a wheel usable on Linux x86_64, so a `uv lock` run on a modern
# workstation cannot silently pick wheels that fail to install on the grid.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Ceilings for transitive deps that moved past the cluster's glibc 2.17. uv
# checks required-environments for *a* wheel, not for one the grid can load, so
# these have to be stated. Each is the newest release still shipping a
# manylinux2014 x86_64 wheel; re-check with scripts/check_glibc_wheels.py after
# changing any pin above.
constraint-dependencies = [
    "pandas<=2.3.2",
    "pillow<=12.2.0",
    "pyarrow<=20.0.0",
]
